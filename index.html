<head>

  <meta name="description" content="ระบบแจ้งเตือนและส่งต่อผู้ป่วยโรคหลอดเลือดสมองวิกฤต โรงพยาบาลกมลาไสย จังหวัดกาฬสินธุ์" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>ทันใจ | TUNJAI Stroke Alert FAST Track ระบบแจ้งเตือนและส่งต่อผู้ป่วยโรคหลอดเลือดสมองวิกฤต - โรงพยาบาลกมลาไสย จังหวัดกาฬสินธุ์</title>

  <!-- Web App Manifest (PWA) -->
  <link rel="manifest" id="pwa-manifest-link" href="manifest.json" />

  <!-- Favicon: Ministry of Public Health Logo (Browser Tab) -->
  <link rel="icon" type="image/png" href="https://bdh.moph.go.th/site/wp-content/uploads/2022/12/cropped-logo-MOPH.png" />
  <link rel="shortcut icon" type="image/png" href="https://bdh.moph.go.th/site/wp-content/uploads/2022/12/cropped-logo-MOPH.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="icon-144.png" />

  <!-- Google Fonts: Anuphan -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS for Interactive Map Pinning -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Service Worker & PWA Manifest Path Normalization -->
  <script>
    (function () {
      // Determine application root base URL for sub-paths (e.g. /tunjai/)
      const path = window.location.pathname;
      let baseDir = '/';
      if (path.startsWith('/tunjai')) {
        baseDir = '/tunjai/';
      } else {
        baseDir = path.substring(0, path.lastIndexOf('/') + 1) || '/';
      }

      // Update manifest link dynamically to avoid 404 on sub-routes
      const manifestLink = document.getElementById('pwa-manifest-link') || document.querySelector('link[rel="manifest"]');
      if (manifestLink) {
        manifestLink.href = baseDir + 'manifest.json';
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          const swUrl = baseDir + 'sw.js';
          navigator.serviceWorker.register(swUrl, { scope: baseDir })
            .then(function (reg) {
              console.log('✅ Service Worker registered:', reg.scope);
            })
            .catch(function (err) {
              console.warn('⚠️ Service Worker registration failed:', err);
            });
        });
      }
    })();
  </script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-teal-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
